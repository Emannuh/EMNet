<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Emmsuite ISP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; }
    .login-card { border-radius: 12px; }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

      <div class="text-center mb-4">
        <i class="bi bi-broadcast-pin fs-1 text-white"></i>
        <h4 class="text-white mt-2 mb-0">Emmsuite ISP</h4>
        <small class="text-secondary">Management Platform</small>
      </div>

      <div class="card login-card border-0 shadow-lg">
        <div class="card-body p-4">
          <h5 class="card-title mb-4">Sign in</h5>

          {% if form.non_field_errors %}
          <div class="alert alert-danger py-2">
            {% for e in form.non_field_errors %}{{ e }}{% endfor %}
          </div>
          {% endif %}

          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label for="id_username" class="form-label">Email</label>
              <input type="email" name="username" id="id_username" autofocus
                     class="form-control {% if form.username.errors %}is-invalid{% endif %}"
                     placeholder="you@example.com"
                     value="{{ form.username.value|default:'' }}">
              {% for e in form.username.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
            </div>

            <div class="mb-4">
              <label for="id_password" class="form-label">Password</label>
              <input type="password" name="password" id="id_password"
                     class="form-control {% if form.password.errors %}is-invalid{% endif %}">
            </div>

            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
            </button>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
