# ─────────────────────────────────────────────────────────────────────────────
# NetSuite-ISP  —  Nginx reverse proxy config (dev/MVP)
# Routes:
#   /portal/*  and  /payments/*  → FastAPI captive portal (port 8001)
#   everything else              → Django (port 8000)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    upstream django {
        server django:8000;
    }

    upstream portal {
        server portal:8001;
    }

    # ── DeeNet demo tenant — accessible at http://localhost:8090 ─────────
    # No hosts file entry needed. Nginx injects Host: deenet.localhost
    # so django-tenants resolves it to the deenet schema.
    server {
        listen 8090;
        server_name _;

        client_max_body_size 20M;

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
        }
        location /media/ {
            alias /app/mediafiles/;
        }

        location ~ ^/(portal|payments|vouchers|sessions|health) {
            proxy_pass         http://portal;
            proxy_set_header   Host              deenet.localhost;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Tenant-Schema   deenet;
        }

        location / {
            proxy_pass         http://django;
            proxy_set_header   Host              deenet.localhost;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ── Default (public / super-admin) ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        # Static files served directly by Nginx
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/mediafiles/;
        }

        # Captive portal public endpoints
        location ~ ^/(portal|payments|vouchers|sessions|health) {
            proxy_pass         http://portal;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Derive tenant schema from subdomain and forward to portal service
            # e.g. isp1.example.com → X-Tenant-Schema: isp1
            set $tenant $host;
            if ($host ~* "^([^.]+)\.") {
                set $tenant $1;
            }
            proxy_set_header X-Tenant-Schema $tenant;
        }

        # Django admin, dashboard, API
        location / {
            proxy_pass         http://django;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
