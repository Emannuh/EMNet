# FreeRADIUS clients.conf
# NAS entries are managed via Django admin (RadiusNas model) and
# loaded from the SQL database at runtime.
# This file only defines the fallback localhost client for testing.

client localhost {
    ipaddr          = 127.0.0.1
    secret          = testing123
    shortname       = localhost
    nas_type        = other
    require_message_authenticator = true
}
