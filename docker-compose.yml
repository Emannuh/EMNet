version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# NetSuite-ISP  —  Docker Compose (dev)
# Run:  docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

x-django-env: &django-env
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings

services:

  # ── PostgreSQL + TimescaleDB ───────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: netsuite_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netsuite_isp}
      POSTGRES_USER: ${POSTGRES_USER:-netsuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./docker/postgres/init_radius_schema.sql:/docker-entrypoint-initdb.d/02_radius_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netsuite} -d ${POSTGRES_DB:-netsuite_isp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: netsuite_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Django (runs migrations, then serves) ────────────────────────────────
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netsuite_django
    restart: unless-stopped
    <<: *django-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 120
               --access-logfile -"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker ─────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netsuite_celery
    restart: unless-stopped
    <<: *django-env
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  # Depends on django so migrations run before beat queries the DB
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netsuite_beat
    restart: unless-stopped
    <<: *django-env
    command: "sh -c 'sh /app/scripts/wait_for_migrations.sh && celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler'"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      django:
        condition: service_started

  # ── FastAPI captive portal service ────────────────────────────────────────
  portal:
    build:
      context: .
      dockerfile: captive_portal/Dockerfile
    container_name: netsuite_portal
    restart: unless-stopped
    env_file: .env
    command: uvicorn captive_portal.main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── FreeRADIUS ────────────────────────────────────────────────────────────
  freeradius:
    build:
      context: ./docker/freeradius
      dockerfile: Dockerfile
    container_name: netsuite_radius
    restart: unless-stopped
    environment:
      RADIUS_DB_HOST: db
      RADIUS_DB_PORT: ${RADIUS_DB_PORT:-5432}
      RADIUS_DB_NAME: ${RADIUS_DB_NAME:-radius}
      RADIUS_DB_USER: ${RADIUS_DB_USER:-radius}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "radtest", "healthcheck", "healthcheck", "127.0.0.1", "0", "testing123"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  # Port 80 is reserved on Windows — using 8080 instead
  nginx:
    image: nginx:1.27-alpine
    container_name: netsuite_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    ports:
      - "8080:80"      # public schema (super-admin)
      - "8090:8090"    # deenet demo tenant (no hosts file needed)
    depends_on:
      - django
      - portal

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
